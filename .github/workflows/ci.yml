name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tokens validate and meet WCAG AA
        run: pnpm tokens:check
      - run: pnpm turbo run build lint typecheck test
      - name: Smoke test every app
        run: |
          pnpm --filter admin-starter exec playwright install --with-deps chromium
          pnpm turbo run e2e --concurrency=1
